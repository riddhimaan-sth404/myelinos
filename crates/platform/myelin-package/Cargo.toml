[package]
name = "myelin-package"
version = "0.1.0"
edition = "2021"
description = "Canonical package management, archive packing, isolation enforcement, and transaction coordination for Myelin"

[dependencies]
myelin-types = { path = "../../foundational/myelin-types" }
myelin-artifact = { path = "../myelin-artifact" }
myelin-generation = { path = "../myelin-generation" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tar = "0.4"
flate2 = "1.0"
libc = "0.2"
zstd = "0.13"
ureq = { version = "2.9", features = ["json"] }

[dev-dependencies]
tempfile = "3.10"

