[package]
name = "myelin-artifact"
version = "0.1.0"
edition = "2021"
description = "Content-addressed artifact store, verification, and provenance for Myelin"

[dependencies]
myelin-types = { path = "../../foundational/myelin-types" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
thiserror = "2.0"
